{% extends 'base.html' %}

{% block content %}

<!-- ===== HEADER ===== -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2><i class="fa-solid fa-book-open"></i> Lesson</h2>
        <p class="text-muted">Read and rate your understanding</p>
    </div>

    <a href="/child/dashboard" class="btn btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back
    </a>
</div>

{% if lesson %}
<div class="card p-4">

    <!-- ===== LESSON CONTENT ===== -->
    <h4>{{ lesson.title }}</h4>
    <p class="mt-2">{{ lesson.content }}</p>

    <hr>

    <!-- ===== SELF ASSESSMENT ===== -->
    <h6><i class="fa-solid fa-pen"></i> Self Assessment</h6>

    <form method="POST" action="/activity/{{ lesson.id }}">

        <label class="mb-1">
            How well did you understand this lesson? (0 - 10)
        </label>

        <input 
            type="number" 
            name="score" 
            min="0" 
            max="10"
            class="form-control mb-3" 
            placeholder="Enter a score between 0 and 10"
            required
        >

        <button class="btn btn-success w-100">
            <i class="fa-solid fa-check"></i> Submit Score
        </button>

    </form>

</div>

{% else %}

<div class="card p-3 text-center">
    <p>No lesson available.</p>
</div>

{% endif %}

{% endblock %}
